name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install modules
        run: yarn

      - name: Security audit
        run: yarn audit --level moderate || true

      - name: Lint
        run: yarn run lint

      - name: Run tests
        run: yarn run test

      - name: Build
        run: yarn run build