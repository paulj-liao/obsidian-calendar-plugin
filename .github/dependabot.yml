version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "liamcain"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group updates to reduce PR spam
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      rollup-plugins:
        patterns:
          - "@rollup/*"
          - "rollup*"
      testing:
        patterns:
          - "jest*"
          - "@types/jest"
          - "ts-jest"
          - "svelte-jester"
      svelte:
        patterns:
          - "svelte*"
          - "@tsconfig/svelte"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    reviewers:
      - "liamcain"
    labels:
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
